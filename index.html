<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eman's </title> Website 🌸</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff0f6;
      color: #5c4050;
      text-align: center;
    }

    header {
      background: #ffb6d9;
      padding: 30px;
      border-radius: 0 0 30px 30px;
    }

    h1 {
      margin: 0;
      color: white;
      font-size: 40px;
    }

    .subtitle {
      color: white;
      font-size: 18px;
    }

    .card {
      background: white;
      width: 80%;
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(255, 150, 190, 0.25);
    }

    .heart {
      font-size: 50px;
    }

    button {
      background: #ff8fc7;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ff70b5;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      color: #a56b88;
    }
  </style>
</head>

<body>

  <header>
    <h1>♡ Hello! ♡</h1>
    <p class="subtitle">Welcome to my cute little website 🌸</p>
  </header>

  <div class="card">
    <div class="heart">💗</div>

    <h2>About Me</h2>

    <p>
      Hi! I'm learning HTML and making cute websites ✨
    </p>

    <button onclick="sayHello()">Click Me 🌷</button>
  </div>

  <footer>
    Made with ♡ and a little bit of magic ✨
  </footer>

  <script>
    function sayHello() {
      alert("Hello cutie! 🌸💗");
    }
  </script>

</body>
</html>
